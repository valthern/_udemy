<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <title>Gutters</title>
    <style>
        .container {
            background: #FFE8E8;
        }
        .row {
            background-color: #e8e8e8;
            margin-top: 20px;
        }
        .contenido {
            background: #f2f2f2;
            text-align: center;
            padding: 10px;
            border: 1px solid #4d5061;
        }
</style>
</head>
<body>
    <div class="container">
        <!-- 
            Podemos establecer diferentes tamaños de gutters (espacios entre columnas) utilizando las clases:
            g-0     No gutter
            g-1     Small gutter
            g-2     Medium gutter
            g-3     Large gutter
            g-4     Extra large gutter
            g-5     Extra extra large gutter
        -->
        <div class="row gx-5 gy-5">
            <div class="col-6">
                <div class="contenido">Columna 1</div>
            </div>
            <div class="col-6">
                <div class="contenido">Columna 2</div>
            </div>
            <div class="col-6">
                <div class="contenido">Columna 3</div>
            </div>
            <div class="col-6">
                <div class="contenido">Columna 4</div>
            </div>
        </div>
    </div>
    
    <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
