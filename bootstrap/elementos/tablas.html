<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <title>Tablas</title>
    <style>
        /* Estilos personalizados aquí*/
    </style>
</head>

<body>
    <!--
    Colores:
    Tenemos variantes disponibles para toda la tabla, toda una fila o una celda
    .table-primary
    .table-secondary
    .table-success
    .table-danger
    .table-warning
    .table-info
    .table-light
    .table-dark
    -->

    <!--
    Clases de Tablas:
    Estas clases también están disponibles apra los diferentes colores:
    .table-striped - Colorea en formto zebra para mejorar su lectura
    .table-hover - Cambia el color de fondo al pasar el mouse por encima
    .table-sm - Reduce el tamaño de la tabla
    .table-bordered - Agrega bordes a la tabla
    .table-borderless - Quita los bordes de la tabla
    .table-responsive - Hace que la tabla sea responsiva y se pueda desplazar horizontalmente. 
        Se debe aplicar a un contenedor que envuelva la tabla. Se puede usar con las siguientes clases:
        .table-responsive-sm
        .table-responsive-md
        .table-responsive-lg
        .table-responsive-xl
    -->
    <div class="container">
        <div class="row">
            <div class="col">

                <div class="table-responsive">

                    <table class="table table-striped table-hover table-sm table-bordered">
                        <caption>Lista de amigos</caption>
                        <thead>
                            <tr class="table-dark">
                                <th>Id</th>
                                <th>Nombre</th>
                                <th>Edad</th>
                                <th>País</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th>1</th>
                                <td>Carlos</td>
                                <td>25</td>
                                <td>México</td>
                            </tr>
                            <tr class="table-primary">
                                <th>2</th>
                                <td>Alejandro</td>
                                <td class="table-active">34</td>
                                <td>España</td>
                            </tr>
                            <tr>
                                <th>3</th>
                                <td>Cesar</td>
                                <td>30</td>
                                <td>Colombia</td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </div>
        </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
</body>

</html>
